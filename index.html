<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de Colorear</title>
  
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/main.css"> 
</head>
<body>

  <!-- PANTALLA PRINCIPAL / MENÚ -->
  <div id="main-menu" class="screen active">
    <header class="app-header">
    </header>

    <main class="menu-content">
      <div id="tab-slider" class="tab-slider">
        <!-- Pestaña 0: Mis Dibujos -->
        <section class="tab-page">
        </section>

        <!-- Pestaña 1: Buscar (Grid de 30) -->
        <section class="tab-page">
          <div id="search-grid" class="grid-container"></div>
        </section>

        <!-- Pestaña 2: Ajustes -->
        <section class="tab-page">
        </section>
      </div>
    </main>

    <!-- Barra Inferior Fija -->
    <nav class="bottom-nav">
      <button class="nav-item" data-tab="0" data-title="Mis Dibujos">Mis dibujos</button>
      <button class="nav-item active" data-tab="1" data-title="Buscar">Buscar</button>
      <button class="nav-item" data-tab="2" data-title="Ajustes">Ajustes</button>
    </nav>
  </div>
  
  <!-- PANTALLA DE JUEGO MINIMALISTA -->
<div id="game-screen" class="screen">
    
    <!-- Botón Flotante Circular de Retorno -->
    <button id="btn-back" class="btn-floating-back" aria-label="Volver al menú">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>

    <!-- Árbol de capas del juego (Square Canvas Container) -->
    <div class="canvas-container">
      <!-- Capa 1: Lienzo sobre el que pinta el algoritmo Flood Fill -->
      <canvas id="paint-canvas"></canvas>

      <!-- Capa 2: Overlay con las líneas del dibujo y los números (Lineart) -->
      <img id="lineart-overlay" alt="Lineart" />

      <!-- Capa 3: Canvas oculto para leer los ID de región en el canal Rojo (R) -->
      <canvas id="map-canvas" style="display: none;"></canvas>
    </div>

    <!-- Barra Dinámica de la Paleta de Colores (Scroll Horizontal) -->
    <div class="color-palette">
      <!-- Los botones de colores se generan dinámicamente según el dibujo activo -->
    </div>
  </div>

  

  <!-- Carga de Scripts -->
  <script src="js/drawings.js"></script>
  <script type="module" src="JS/main.js"></script>
</body>
</html>
