<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Juego de Colorear</title>

  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- PANTALLA PRINCIPAL / MENÚ -->
  <div id="main-menu" class="screen active">
    <header class="app-header">
      <h1 id="header-title">Buscar</h1>
    </header>

    <main class="menu-content">
      <div id="tab-slider" class="tab-slider">
        <!-- Pestaña 0: Mis Dibujos -->
        <section class="tab-page"></section>

        <!-- Pestaña 1: Buscar -->
        <section class="tab-page">
          <div id="search-grid" class="grid-container"></div>
        </section>

        <!-- Pestaña 2: Ajustes -->
        <section class="tab-page"></section>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item" data-tab="0" data-title="Mis Dibujos">Mis dibujos</button>
      <button class="nav-item active" data-tab="1" data-title="Buscar">Buscar</button>
      <button class="nav-item" data-tab="2" data-title="Ajustes">Ajustes</button>
    </nav>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="game-screen" class="screen">
    <button id="btn-back" class="btn-floating-back" aria-label="Volver al menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>

    <div class="canvas-container">
      <!-- Capa 1: lienzo donde se pinta -->
      <canvas id="paint-canvas"></canvas>
      <!-- Capa 2: líneas y números (lineart) -->
      <img id="lineart-overlay" alt="Lineart">
    </div>

    <!-- Paleta dinámica (la genera palette.js) -->
    <div class="color-palette"></div>

    <!-- Pantalla de enhorabuena (se muestra al terminar el dibujo) -->
    <div id="win-overlay" class="win-overlay" hidden>
      <div class="win-card">
        <div class="win-emoji">🎉</div>
        <h2>¡Enhorabuena!</h2>
        <p>Has completado el dibujo</p>
        <img id="win-preview" alt="Tu dibujo terminado" hidden>
        <div class="win-actions">
          <button id="btn-restart" class="btn-primary" type="button">Reiniciar dibujo</button>
          <button id="btn-win-menu" class="btn-secondary" type="button">Volver al menú</button>
        </div>
      </div>
    </div>
  </div>

  <!-- drawings.js ya es módulo: lo importa main.js -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
