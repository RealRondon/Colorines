<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Pintar</title>
  
  <!-- Icono de la app apuntando a la carpeta imgs -->
  <link rel="apple-touch-icon" href="imgs/icon.png">
  <link rel="icon" type="image/png" href="imgs/icon.png">
  
  <!-- Configuración para iOS / iPadOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pintar Colores">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-container">
    <!-- Paleta de colores -->
    <div class="palette">
      <button class="color-btn active" data-color="#ff4757" style="background-color: #ff4757;"></button>
      <button class="color-btn" data-color="#2ed573" style="background-color: #2ed573;"></button>
      <button class="color-btn" data-color="#1e90ff" style="background-color: #1e90ff;"></button>
      <button class="color-btn" data-color="#ffa502" style="background-color: #ffa502;"></button>
      <button class="color-btn" data-color="#9b59b6" style="background-color: #9b59b6;"></button>
    </div>

    <!-- Lienzo SVG interactivo (Ejemplo: Dibujo básico de 4 cuadrantes) -->
    <div class="canvas-container">
      <svg id="paint-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path class="paintable" d="M 10 10 H 90 V 90 H 10 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <path class="paintable" d="M 110 10 H 190 V 90 H 110 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <path class="paintable" d="M 10 110 H 90 V 190 H 10 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <path class="paintable" d="M 110 110 H 190 V 190 H 110 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      </svg>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
