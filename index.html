<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de Colorear</title>
  
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- PANTALLA PRINCIPAL / MENÚ -->
  <div id="main-menu" class="screen active">
    <header class="app-header">
      <h1 id="header-title">Buscar</h1>
    </header>

    <main class="menu-content">
      <div id="tab-slider" class="tab-slider">
        <!-- Pestaña 0: Mis Dibujos -->
        <section class="tab-page">
          <h2>Mis Dibujos</h2>
        </section>

        <!-- Pestaña 1: Buscar (Grid de 30) -->
        <section class="tab-page">
          <div id="search-grid" class="grid-container"></div>
        </section>

        <!-- Pestaña 2: Ajustes -->
        <section class="tab-page">
          <h2>Ajustes</h2>
        </section>
      </div>
    </main>

    <!-- Barra Inferior Fija -->
    <nav class="bottom-nav">
      <button class="nav-item" data-tab="0" data-title="Mis Dibujos">Mis dibujos</button>
      <button class="nav-item active" data-tab="1" data-title="Buscar">Buscar</button>
      <button class="nav-item" data-tab="2" data-title="Ajustes">Ajustes</button>
    </nav>
  </div>

  <!-- PANTALLA DE JUEGO (SISTEMA DE MÁSCARA Y PINTURA) -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <button id="btn-back" class="btn-back">← Menú</button>
      <h2>¡A colorear por números!</h2>
    </header>

    <main class="game-content">
      <div id="canvas-container" class="canvas-container">
        <!-- Capa 1: Canvas de Pintura Visible -->
        <canvas id="paint-canvas"></canvas>
        
        <!-- Capa 2: Líneas y números transparentes superpuestos -->
        <img id="lineart-overlay" src="" alt="Líneas del dibujo" />

        <!-- Capa 3: Canvas Oculto para detectar las zonas de color en el mapa -->
        <canvas id="map-canvas" style="display: none;"></canvas>
      </div>
    </main>

    <!-- Paleta de Colores Numerada (Estilo Happy Color) -->
    <footer class="color-palette">
      <button class="color-btn active" data-number="1" style="background-color: #ffdd59;">1</button>
      <button class="color-btn" data-number="2" style="background-color: #3867d6;">2</button>
      <button class="color-btn" data-number="3" style="background-color: #4b6584;">3</button>
      <button class="color-btn" data-number="4" style="background-color: #eb3b5a;">4</button>
    </footer>
  </div>

  <!-- Carga de Scripts -->
  <script src="js/drawings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
