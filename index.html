<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Pintar</title>
  
  <link rel="icon" type="image/png" href="imgs/icon.png">
  <link rel="apple-touch-icon" href="imgs/icon.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pintar Colores">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA 1: Menú Principal -->
  <section id="main-menu" class="screen active">
    <header class="app-header">
      <h1 id="header-title">Buscar Dibujos</h1>
    </header>

    <main class="menu-feed">
      <div class="tab-slider" id="tab-slider" style="transform: translateX(-33.33333%);">
        
        <!-- PESTAÑA 0: Mis Dibujos -->
        <div id="tab-my-drawings" class="tab-content">
          <div class="card-preview play-trigger">
            <div class="placeholder-square">
              <span>Toca para pintar</span>
            </div>
            <div class="card-info">
              <h3>Dibujo 1 - Paisaje</h3>
            </div>
          </div>
        </div>

        <!-- PESTAÑA 1: Buscar (Grid de 30 cuadrados) -->
        <div id="tab-search" class="tab-content">
          <div class="search-grid" id="search-grid"></div>
        </div>

        <!-- PESTAÑA 2: Ajustes -->
        <div id="tab-settings" class="tab-content">
          <p class="settings-placeholder">Opciones de configuración...</p>
        </div>

      </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav">
      <button class="nav-item" data-tab="0" data-title="Mis Dibujos">
        <span class="nav-icon">🖼️</span>
        <span class="nav-label">Mis dibujos</span>
      </button>
      <button class="nav-item active" data-tab="1" data-title="Buscar Dibujos">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Buscar</span>
      </button>
      <button class="nav-item" data-tab="2" data-title="Ajustes">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Ajustes</span>
      </button>
    </nav>
  </section>

  <!-- PANTALLA 2: Lienzo de Juego -->
  <section id="game-screen" class="screen">
    <header class="game-header">
      <button id="btn-back" class="btn-back"> ← </button>
    </header>

    <main class="app-container">
      <div class="palette">
        <button class="color-btn active" data-color="#ff4757" style="background-color: #ff4757;"></button>
        <button class="color-btn" data-color="#2ed573" style="background-color: #2ed573;"></button>
        <button class="color-btn" data-color="#1e90ff" style="background-color: #1e90ff;"></button>
        <button class="color-btn" data-color="#ffa502" style="background-color: #ffa502;"></button>
        <button class="color-btn" data-color="#9b59b6" style="background-color: #9b59b6;"></button>
      </div>

      <div class="canvas-container" id="canvas-container">
        <svg id="paint-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <path class="paintable" d="M 0 0 H 500 V 500 H 0 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
          <circle class="paintable" cx="250" cy="140" r="50" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
          <path class="paintable" d="M 30 380 L 180 180 L 280 380 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
          <path class="paintable" d="M 200 380 L 330 220 L 470 380 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
          <path class="paintable" d="M 0 380 Q 250 340 500 380 V 500 H 0 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
        </svg>
      </div>
    </main>
  </section>

  <script src="js/drawings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
